# The URL the site will be built for
base_url = "https://thehuglet.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

title = "thehuglet"
theme = "terminimal"


# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[extra]
favicon = "/favicon.png"
accent_color = "orange"
background_color = "dark"
logo_text = "thehuglet"
author = "thehuglet"

menu_items = [
    {name = "projects", url = "$BASE_URL"},
    {name = "about", url = "$BASE_URL/pages/about"},
]
